<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Свой чат</title>
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Экран PIN-кода --- */
        #pin-screen {
            position: fixed;
            inset: 0;
            background: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }
        #pin-screen h2 { font-size: 20px; margin-bottom: 20px; color: #333; }
        #pin-input {
            font-size: 24px;
            padding: 12px 20px;
            border: 2px solid #e4e6eb;
            border-radius: 12px;
            text-align: center;
            letter-spacing: 8px;
            width: 200px;
            outline: none;
        }
        #pin-input:focus { border-color: #0084ff; }
        #pin-btn {
            margin-top: 16px;
            background: #0084ff;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        #pin-btn:disabled { opacity: 0.5; }
        #pin-error { color: #e74c3c; margin-top: 12px; font-size: 14px; min-height: 20px; }

        /* --- Отладочная панель --- */
        #debug-info {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1e1e1e;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            padding: 8px;
            max-height: 40vh;
            overflow-y: auto;
            z-index: 200;
            border-top: 2px solid #ffcc00;
            white-space: pre-wrap;
            word-break: break-all;
        }
        #debug-info .label { color: #ffcc00; font-weight: bold; }
        #debug-toggle {
            position: fixed;
            bottom: 8px;
            right: 8px;
            background: #ffcc00;
            color: #000;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            z-index: 201;
        }

        /* --- Основной чат --- */
        #chat-screen { display: none; flex-direction: column; height: 100vh; }
        #chat-screen.active { display: flex; }

        #header {
            background: #ffffff;
            padding: 12px 16px;
            border-bottom: 1px solid #e4e6eb;
            font-weight: 600;
            font-size: 16px;
        }
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .msg {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 16px;
            background: #ffffff;
            align-self: flex-start;
            word-wrap: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .msg.me { background: #0084ff; color: #ffffff; align-self: flex-end; }
        .msg .author { font-size: 11px; font-weight: 600; opacity: 0.7; margin-bottom: 2px; }
        .msg .time { font-size: 10px; opacity: 0.6; margin-top: 4px; text-align: right; }
        #input-area {
            display: flex;
            padding: 8px;
            background: #ffffff;
            border-top: 1px solid #e4e6eb;
            gap: 8px;
        }
        #input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #e4e6eb;
            border-radius: 20px;
            font-size: 15px;
            outline: none;
        }
        #send-btn {
            background: #0084ff;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        #send-btn:disabled { opacity: 0.5; }
    </style>
</head>
<body>
    <!-- Экран PIN -->
    <div id="pin-screen">
        <h2>Введите PIN-код</h2>
        <input type="password" id="pin-input" inputmode="numeric" maxlength="6" placeholder="••••">
        <button id="pin-btn" onclick="checkPin()">Войти</button>
        <div id="pin-error"></div>
    </div>

    <!-- Основной чат -->
    <div id="chat-screen">
        <div id="header">Свой чат</div>
        <div id="messages"></div>
        <div id="input-area">
            <input type="text" id="input" placeholder="Сообщение..." autocomplete="off">
            <button id="send-btn" onclick="sendMessage()">→</button>
        </div>
    </div>

    <!-- Отладочная панель -->
    <div id="debug-info"></div>
    <button id="debug-toggle" onclick="toggleDebug()">DBG</button>

    <script>
        // ========== ОТЛАДОЧНАЯ ПАНЕЛЬ ==========
        let debugVisible = true;
        function logDebug(label, value) {
            const el = document.getElementById("debug-info");
            if (!el) return;
            const text = typeof value === "object" ? JSON.stringify(value, null, 2) : String(value);
            el.innerHTML += `<span class="label">${label}:</span>\n${text}\n\n`;
            el.scrollTop = el.scrollHeight;
        }
        function toggleDebug() {
            debugVisible = !debugVisible;
            document.getElementById("debug-info").style.display = debugVisible ? "block" : "none";
        }

        // ========== ИНИЦИАЛИЗАЦИЯ ==========
        const webApp = window.WebApp;
        let initData = "";

        logDebug("window.WebApp существует?", webApp ? "ДА" : "НЕТ");

        if (webApp) {
            webApp.ready();
            initData = webApp.initData || "";
            logDebug("initData (из webApp.initData)", initData);
            logDebug("initData длина", initData.length);
            logDebug("initDataUnsafe", webApp.initDataUnsafe || {});
            logDebug("Ключи webApp", Object.keys(webApp));
            logDebug("Ключи initDataUnsafe", Object.keys(webApp.initDataUnsafe || {}));

            // Проверяем, есть ли в initData поле hash
            const hashMatch = initData.match(/hash=([^&]+)/);
            logDebug("hash из initData", hashMatch ? hashMatch[1] : "НЕ НАЙДЕН");

            // Проверяем URL-фрагмент (после #)
            logDebug("URL полностью", window.location.href);
            logDebug("URL hash (после #)", window.location.hash);
            logDebug("URL search (после ?)", window.location.search);

            // Проверяем, есть ли в URL параметр WebAppData
            const hashParams = new URLSearchParams(window.location.hash.slice(1));
            const webAppData = hashParams.get("WebAppData");
            logDebug("WebAppData из URL", webAppData || "НЕ НАЙДЕН");
            if (webAppData) {
                logDebug("WebAppData длина", webAppData.length);
            }
        } else {
            console.warn("MAX Bridge не найден. Режим отладки.");
            initData = "debug_mode";
            logDebug("Режим отладки", "initData = debug_mode");
        }

        const myUser = webApp?.initDataUnsafe?.user || { id: "debug", first_name: "Я" };
        const myId = String(myUser.id);

        const API_BASE = "https://tressubluna.ru";

        // ========== ПРОВЕРКА PIN ==========
        async function checkPin() {
            const pin = document.getElementById("pin-input").value.trim();
            const errEl = document.getElementById("pin-error");
            const btn = document.getElementById("pin-btn");
            errEl.textContent = "";

            logDebug("Проверка PIN", pin);

            if (!pin) {
                errEl.textContent = "Введите PIN-код";
                return;
            }

            btn.disabled = true;
            try {
                logDebug("Отправка на сервер", `${API_BASE}/verify_pin`);
                logDebug("Заголовок x-max-init-data (первые 100)", initData.slice(0, 100));

                const res = await fetch(`${API_BASE}/verify_pin`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "x-max-init-data": initData
                    },
                    body: JSON.stringify({ pin })
                });
                logDebug("Ответ сервера", `HTTP ${res.status}`);
                if (!res.ok) {
                    errEl.textContent = "Неверный PIN-код";
                    const text = await res.text();
                    logDebug("Тело ответа", text);
                    return;
                }
                logDebug("PIN верный", "открываем чат");
                document.getElementById("pin-screen").style.display = "none";
                document.getElementById("chat-screen").classList.add("active");
                loadMessages();
                setInterval(loadMessages, 5000);
            } catch (e) {
                errEl.textContent = "Ошибка соединения";
                logDebug("Ошибка fetch", e.message);
            } finally {
                btn.disabled = false;
            }
        }

        // Отправка PIN по Enter
        document.getElementById("pin-input").addEventListener("keydown", (e) => {
            if (e.key === "Enter") checkPin();
        });

        // ========== ЧАТ ==========
        async function loadMessages() {
            try {
                const res = await fetch(`${API_BASE}/messages`, {
                    headers: { "x-max-init-data": initData }
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const messages = await res.json();
                renderMessages(messages);
            } catch (e) {
                console.error("Ошибка загрузки:", e);
            }
        }

        async function sendMessage() {
            const input = document.getElementById("input");
            const text = input.value.trim();
            if (!text) return;

            const btn = document.getElementById("send-btn");
            btn.disabled = true;
            input.value = "";

            try {
                const res = await fetch(`${API_BASE}/messages`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "x-max-init-data": initData
                    },
                    body: JSON.stringify({ text })
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                await loadMessages();
            } catch (e) {
                console.error("Ошибка отправки:", e);
                alert("Не удалось отправить сообщение");
            } finally {
                btn.disabled = false;
            }
        }

        function renderMessages(messages) {
            const container = document.getElementById("messages");
            container.innerHTML = "";
            messages.forEach(m => {
                const div = document.createElement("div");
                div.className = "msg" + (String(m.user_id) === myId ? " me" : "");

                const author = document.createElement("div");
                author.className = "author";
                author.textContent = m.user;

                const text = document.createElement("div");
                text.textContent = m.text;

                const time = document.createElement("div");
                time.className = "time";
                time.textContent = new Date(m.time).toLocaleTimeString("ru-RU", {
                    hour: "2-digit", minute: "2-digit"
                });

                div.appendChild(author);
                div.appendChild(text);
                div.appendChild(time);
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        document.getElementById("input").addEventListener("keydown", (e) => {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
